<!DOCTYPE html>
<html>

<head>
    <title>rps</title>
</head>

<body>
    <p>Rock Paper Scissors</p>
    <button>Rock</button>
    <button>Paper</button>
    <button>Scissors</button>
    <script>
        //shortcut for if-statement
        // ? : 
        let message = 5 + 10 == 15 ? 'right cal' : 'wrong cal'
        console.log(message);

        // && : if 1 false then code stop early at first statement, if the first
        //statement true then code stop at the second statement
        let message2 = true && 'hello';
        console.log(message2);
        // || : this also stop early too as '&&'
    </script>
</body>

</html>
